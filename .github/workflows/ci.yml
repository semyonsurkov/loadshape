name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm build
      - run: pnpm --filter loadshape pack --pack-destination /tmp
      - run: pnpm dlx publint@0.3.25 /tmp/loadshape-*.tgz
      - run: pnpm dlx @arethetypeswrong/cli@0.18.5 /tmp/loadshape-*.tgz --profile esm-only --exclude-entrypoints ./styles.css
